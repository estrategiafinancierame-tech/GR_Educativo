<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --accent:#275CAB;
    --accent-dark:#193B6F;
    --accent-soft:#E5EBF4;
    --paper:#F7F9F6;
    --line:#DCE2DC;
    --ink:#16261C;
    --ink-soft:#5B6E5F;
    --gasto:#9A5A28;
    --gasto-soft:#F3E4D3;
    --card:#FFFFFF;
    --font-display:'Source Serif 4', Georgia, serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-display);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 18px 60px;}

  header{border-bottom:2px solid var(--accent-dark);padding-bottom:14px;margin-bottom:18px;}
  header h1{font-size:1.5rem;font-weight:600;margin:0 0 4px;color:var(--accent-dark);}
  header .meta{font-family:var(--font-mono);font-size:0.76rem;color:var(--ink-soft);}

  /* ============ Estilos de pestañas (TAB_STYLE) ============ */
  .tabs{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap;}
  .tabs button{font-family:var(--font-mono);font-size:0.8rem;cursor:pointer;background:none;}

  .tabs.style-underline{border-bottom:1px solid var(--line);}
  .tabs.style-underline button{
    padding:10px 16px;border:none;color:var(--ink-soft);
    border-bottom:2.5px solid transparent;margin-bottom:-1px;
  }
  .tabs.style-underline button:hover{color:var(--accent-dark);}
  .tabs.style-underline button.active{color:var(--accent-dark);border-bottom-color:var(--accent);font-weight:600;}

  .tabs.style-pill button{
    padding:9px 16px;border:1.5px solid var(--accent);border-radius:20px;color:var(--accent-dark);background:var(--card);
    transition:background .15s ease,color .15s ease;
  }
  .tabs.style-pill button:hover{background:var(--accent-soft);}
  .tabs.style-pill button.active{background:var(--accent);color:#fff;}

  .tabs.style-boxed button{
    padding:9px 16px;border:1px solid var(--line);border-radius:6px;color:var(--ink-soft);background:var(--card);
  }
  .tabs.style-boxed button:hover{border-color:var(--accent);color:var(--accent-dark);}
  .tabs.style-boxed button.active{border-color:var(--accent-dark);background:var(--accent-soft);color:var(--accent-dark);font-weight:600;}

  .panel{display:none;}
  .panel.active{display:block;}

  .entity-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .entity-tabs button{
    font-family:var(--font-mono);font-size:0.8rem;padding:8px 14px;
    border:1.5px solid var(--accent);background:var(--card);color:var(--accent-dark);
    border-radius:20px;cursor:pointer;transition:background .15s ease,color .15s ease;
  }
  .entity-tabs button:hover{background:var(--accent-soft);}
  .entity-tabs button.active{background:var(--accent);color:#fff;}
  .entity-tabs button.todas{border-style:dashed;}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:24px;}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:15px 17px;}
  .kpi .label{font-size:0.78rem;color:var(--ink-soft);margin-bottom:6px;}
  .kpi .value{font-family:var(--font-mono);font-size:1.3rem;font-weight:600;}
  .kpi.ingreso{border-left:4px solid var(--accent);}
  .kpi.gasto{border-left:4px solid var(--gasto);}
  .kpi.resultado{border-left:4px solid var(--accent-dark);}
  .kpi .sub{font-size:0.7rem;color:var(--ink-soft);margin-top:4px;font-family:var(--font-mono);}

  section{margin-bottom:28px;}
  h2{font-size:0.98rem;font-weight:600;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);color:var(--accent-dark);}

  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px;}
  .chart-card canvas{max-height:300px;}

  /* ============ Filtros / slicers (panel general) ============ */
  .filter-bar{
    display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;
    background:var(--card);border:1px solid var(--line);border-radius:6px;
    padding:14px 16px;margin-bottom:20px;
  }
  .filter-group{display:flex;flex-direction:column;gap:4px;}
  .filter-group label{font-family:var(--font-mono);font-size:0.7rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;}
  .filter-group select, .filters select, .filters input{
    font-family:var(--font-mono);font-size:0.8rem;padding:7px 10px;
    border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);
  }
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}

  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:0.85rem;min-width:640px;}
  thead th{text-align:right;padding:9px 12px;background:var(--accent-soft);border-bottom:1px solid var(--line);font-weight:600;font-size:0.74rem;color:var(--accent-dark);font-family:var(--font-mono);}
  thead th:first-child, thead th:nth-child(2), thead th:nth-child(3){text-align:left;}
  tbody td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--font-mono);}
  tbody td:first-child, tbody td:nth-child(2), tbody td:nth-child(3){text-align:left;font-family:var(--font-display);}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFCF8;}

  footer{font-size:0.76rem;color:var(--ink-soft);text-align:center;margin-top:16px;}

  @media (max-width:640px){
    .wrap{padding:16px 10px 40px;}
    .kpis{grid-template-columns:1fr;gap:10px;}
    header h1{font-size:1.2rem;}
    .chart-card{padding:12px;}
    .chart-card canvas{max-height:220px;}
    table{font-size:0.76rem;}
    thead th, tbody td{padding:7px 8px;}
    .tabs{overflow-x:auto;flex-wrap:nowrap;}
    .tabs button{white-space:nowrap;}
    .filter-bar{flex-direction:column;align-items:stretch;}
  }
</style>
</head>

const ACCENT = "#275CAB";
const ACCENT_DARK = "#193B6F";
const GASTO_COLOR = "#9A5A28";

const fmt = n => "$" + Math.round(n).toLocaleString("es-CO");
const fmtPct = n => (isFinite(n) ? (n>=0?"+":"") + (n*100).toFixed(1) + "%" : "—");
const sum = arr => arr.reduce((a,b)=>a+b,0);
const nombreEmpresa = emp => DATA.empresasDisplay[emp] || emp;

function sumaClase(dataEmpresaAnio, clases){
  return clases.reduce((acc,c)=> acc + (dataEmpresaAnio[c] ? sum(dataEmpresaAnio[c]) : 0), 0);
}
function serieClase(dataEmpresaAnio, clases){
  const out = new Array(12).fill(0);
  clases.forEach(c=>{
    if(dataEmpresaAnio[c]){
      dataEmpresaAnio[c].forEach((v,i)=> out[i]+=v);
    }
  });
  return out;
}
function mesesConDatos(serieIngresos, serieGastos){
  return DATA.meses.filter((m,i)=> serieIngresos[i]!==0 || serieGastos[i]!==0);
}

const anioActual = Math.max(...DATA.anios);
const anioAnterior = DATA.anios.filter(a=>a!==anioActual).sort((a,b)=>b-a)[0] ?? anioActual;

const charts = {};
function destroyChart(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }

function chartOptions(prefix){
  return {
    responsive: true,
    plugins: { legend: { position: "bottom", labels: { font: { family: "IBM Plex Mono", size: 11 } } } },
    scales: {
      y: { ticks: { callback: v => prefix + (v/1e6).toFixed(0) + "M", font: { family: "IBM Plex Mono", size: 10 } }, grid: { color: "#DCE2DC" } },
      x: { ticks: { font: { family: "IBM Plex Mono", size: 10 } }, grid: { display: false } }
    }
  };
}
function shadeColor(hex, index){
  const palette = [hex, "#5B8C6E", "#134A2A", "#8FBF9F", "#2E7D50", "#0D3820"];
  return palette[index % palette.length];
}
function tipoGrafico(panelId, fallback){
  return (DATA.chartTypes && DATA.chartTypes[panelId]) || fallback;
}

let filtroGeneral = { anio: anioActual, mesDesde: 0, mesHasta: 11 };

function renderPanelGeneral(){
  const selAnio = document.getElementById("gAnio");
  const selDesde = document.getElementById("gMesDesde");
  const selHasta = document.getElementById("gMesHasta");

    selAnio.innerHTML = DATA.anios.slice().sort((a,b)=>b-a).map(a=>`<option value="${a}">${a}</option>`).join("");
    selAnio.value = String(filtroGeneral.anio);
    DATA.meses.forEach((m,i)=>{
      selDesde.innerHTML += `<option value="${i}">${m}</option>`;
      selHasta.innerHTML += `<option value="${i}">${m}</option>`;
    });
    selDesde.value = filtroGeneral.mesDesde;
    selHasta.value = filtroGeneral.mesHasta;
    selAnio.onchange = ()=>{ filtroGeneral.anio = parseInt(selAnio.value); renderPanelGeneral(); };
    selDesde.onchange = ()=>{ filtroGeneral.mesDesde = parseInt(selDesde.value); renderPanelGeneral(); };
    selHasta.onchange = ()=>{ filtroGeneral.mesHasta = parseInt(selHasta.value); renderPanelGeneral(); };
  }

  const desde = Math.min(filtroGeneral.mesDesde, filtroGeneral.mesHasta);
  const hasta = Math.max(filtroGeneral.mesDesde, filtroGeneral.mesHasta);
  const anio = filtroGeneral.anio;
  const rangoMeses = DATA.meses.slice(desde, hasta+1);

  let totalIngresos = 0, totalGastos = 0;
  const porEmpresa = DATA.empresas.map(emp=>{
    const d = DATA.mensual[emp][String(anio)] || {};
    const ing = serieClase(d, DATA.claseIngresos).slice(desde, hasta+1);
    const gas = serieClase(d, DATA.clasesGastos).slice(desde, hasta+1);
    const totalIng = sum(ing), totalGas = sum(gas);
    totalIngresos += totalIng; totalGastos += totalGas;
    return { emp, ing, gas, totalIng, totalGas };
  });

  const kpiWrap = document.getElementById("kpi-general");
  kpiWrap.innerHTML = `
    <div class="kpi ingreso"><div class="label">Ingresos del grupo</div><div class="value">${fmt(totalIngresos)}</div><div class="sub">${rangoMeses[0]}–${rangoMeses[rangoMeses.length-1]} ${anio}</div></div>
    <div class="kpi gasto"><div class="label">Gastos del grupo</div><div class="value">${fmt(totalGastos)}</div><div class="sub">${rangoMeses[0]}–${rangoMeses[rangoMeses.length-1]} ${anio}</div></div>
    <div class="kpi resultado"><div class="label">Utilidad del grupo</div><div class="value">${fmt(totalIngresos-totalGastos)}</div><div class="sub">Periodo seleccionado</div></div>` +
    porEmpresa.map(p=>`
      <div class="kpi resultado"><div class="label">${nombreEmpresa(p.emp)}</div><div class="value">${fmt(p.totalIng-p.totalGas)}</div><div class="sub">Utilidad del periodo</div></div>
    `).join("");

  destroyChart("chartGeneral");
  const tipo = tipoGrafico("general", "bar");
  charts["chartGeneral"] = new Chart(document.getElementById("chartGeneral"), {
    type: tipo,
    data: {
      labels: rangoMeses,
      datasets: porEmpresa.map((p,i)=>({
        label: nombreEmpresa(p.emp),
        data: p.ing,
        backgroundColor: tipo==="bar" ? shadeColor(ACCENT,i) : "transparent",
        borderColor: shadeColor(ACCENT,i),
        borderRadius: 3,
        tension: 0.25,
        pointRadius: 3,
      }))
    },
    options: chartOptions("$")
  });
}

/* ============================== PANEL 1: Ingresos por empresa ============================== */
function renderPanelIngresos(){
  const kpiWrap = document.getElementById("kpi-ingresos");
  let totalGrupo = 0;
  kpiWrap.innerHTML = "";
  DATA.empresas.forEach(emp=>{
    const d = DATA.mensual[emp][String(anioActual)] || {};
    const total = sumaClase(d, DATA.claseIngresos);
    totalGrupo += total;
    const div = document.createElement("div");
    div.className = "kpi ingreso";
    div.innerHTML = `<div class="label">${nombreEmpresa(emp)}</div><div class="value">${fmt(total)}</div><div class="sub">Ingresos acumulados ${anioActual}</div>`;
    kpiWrap.appendChild(div);
  });
  const totalDiv = document.createElement("div");
  totalDiv.className = "kpi resultado";
  totalDiv.innerHTML = `<div class="label">Total grupo</div><div class="value">${fmt(totalGrupo)}</div><div class="sub">Suma de todas las empresas</div>`;
  kpiWrap.appendChild(totalDiv);

  destroyChart("chartIngresosEmpresas");
  const tipo = tipoGrafico("ingresos", "line");
  const datasets = DATA.empresas.map((emp,i)=>{
    const d = DATA.mensual[emp][String(anioActual)] || {};
    const serie = serieClase(d, DATA.claseIngresos);
    return {
      label: nombreEmpresa(emp),
      data: serie,
      borderColor: shadeColor(ACCENT, i),
      backgroundColor: tipo==="bar" ? shadeColor(ACCENT,i) : "transparent",
      tension: 0.25,
      pointRadius: 3,
      borderRadius: 3,
    };
  });
  charts["chartIngresosEmpresas"] = new Chart(document.getElementById("chartIngresosEmpresas"), {
    type: tipo,
    data: { labels: DATA.meses, datasets },
    options: chartOptions("$")
  });
}

/* ============================== PANEL 2: Utilidades ============================== */
function renderPanelUtilidades(){
  const kpiWrap = document.getElementById("kpi-utilidades");
  kpiWrap.innerHTML = "";
  let totalUtilidad = 0;
  DATA.empresas.forEach(emp=>{
    const d = DATA.mensual[emp][String(anioActual)] || {};
    const ingresos = sumaClase(d, DATA.claseIngresos);
    const gastos = sumaClase(d, DATA.clasesGastos);
    const utilidad = ingresos - gastos;
    totalUtilidad += utilidad;
    const div = document.createElement("div");
    div.className = "kpi resultado";
    div.innerHTML = `<div class="label">${nombreEmpresa(emp)}</div><div class="value">${fmt(utilidad)}</div><div class="sub">Utilidad acumulada ${anioActual}</div>`;
    kpiWrap.appendChild(div);
  });
  const totalDiv = document.createElement("div");
  totalDiv.className = "kpi resultado";
  totalDiv.style.borderLeftColor = ACCENT_DARK;
  totalDiv.innerHTML = `<div class="label">Total grupo</div><div class="value">${fmt(totalUtilidad)}</div><div class="sub">Utilidad consolidada</div>`;
  kpiWrap.appendChild(totalDiv);

  destroyChart("chartUtilidades");
  const tipo = tipoGrafico("utilidades", "bar");
  const datasets = DATA.empresas.map((emp,i)=>{
    const d = DATA.mensual[emp][String(anioActual)] || {};
    const ingresos = serieClase(d, DATA.claseIngresos);
    const gastos = serieClase(d, DATA.clasesGastos);
    const utilidad = ingresos.map((v,idx)=> v - gastos[idx]);
    return {
      label: nombreEmpresa(emp),
      data: utilidad,
      backgroundColor: tipo==="bar" ? shadeColor(ACCENT, i) : "transparent",
      borderColor: shadeColor(ACCENT, i),
      borderRadius: 3,
      tension: 0.25,
      pointRadius: 3,
    };
  });
  charts["chartUtilidades"] = new Chart(document.getElementById("chartUtilidades"), {
    type: tipo,
    data: { labels: DATA.meses, datasets },
    options: chartOptions("$")
  });
}

/* ============================== PANEL 3: Ingresos vs Gastos ============================== */
let empresaSeleccionadaIvsG = DATA.empresas[0];
function renderPanelIvsG(){
  const tabsWrap = document.getElementById("entity-tabs-ivsg");
  tabsWrap.innerHTML = "";
  DATA.empresas.forEach(emp=>{
    const btn = document.createElement("button");
    btn.textContent = nombreEmpresa(emp);
    if(emp === empresaSeleccionadaIvsG) btn.classList.add("active");
    btn.onclick = ()=>{ empresaSeleccionadaIvsG = emp; renderPanelIvsG(); };
    tabsWrap.appendChild(btn);
  });

  const d = DATA.mensual[empresaSeleccionadaIvsG][String(anioActual)] || {};
  const ingresos = serieClase(d, DATA.claseIngresos);
  const gastos = serieClase(d, DATA.clasesGastos);

  const kpiWrap = document.getElementById("kpi-ivsg");
  const totalIng = sum(ingresos), totalGas = sum(gastos);
  kpiWrap.innerHTML = `
    <div class="kpi ingreso"><div class="label">Ingresos ${anioActual}</div><div class="value">${fmt(totalIng)}</div></div>
    <div class="kpi gasto"><div class="label">Gastos ${anioActual}</div><div class="value">${fmt(totalGas)}</div></div>
    <div class="kpi resultado"><div class="label">Resultado</div><div class="value">${fmt(totalIng-totalGas)}</div></div>`;

  destroyChart("chartIvsG");
  const meses = mesesConDatos(ingresos, gastos);
  const idxs = meses.map(m=>DATA.meses.indexOf(m));
  const tipo = tipoGrafico("ivsg", "bar");
  charts["chartIvsG"] = new Chart(document.getElementById("chartIvsG"), {
    type: tipo,
    data: {
      labels: meses,
      datasets: [
        { label: "Ingresos", data: idxs.map(i=>ingresos[i]), backgroundColor: ACCENT, borderColor: ACCENT, borderRadius: 3, tension:0.25 },
        { label: "Gastos", data: idxs.map(i=>gastos[i]), backgroundColor: GASTO_COLOR, borderColor: GASTO_COLOR, borderRadius: 3, tension:0.25 },
      ]
    },
    options: chartOptions("$")
  });
}

/* ============================== PANEL 4: Comparativo años anteriores ============================== */
let empresaSeleccionadaComp = "__TODAS__";
function renderPanelComparativo(){
  const tabsWrap = document.getElementById("entity-tabs-comp");
  tabsWrap.innerHTML = "";
  const btnTodas = document.createElement("button");
  btnTodas.textContent = "Todas las empresas";
  btnTodas.className = "todas";
  if(empresaSeleccionadaComp === "__TODAS__") btnTodas.classList.add("active");
  btnTodas.onclick = ()=>{ empresaSeleccionadaComp = "__TODAS__"; renderPanelComparativo(); };
  tabsWrap.appendChild(btnTodas);

  DATA.empresas.forEach(emp=>{
    const btn = document.createElement("button");
    btn.textContent = nombreEmpresa(emp);
    if(emp === empresaSeleccionadaComp) btn.classList.add("active");
    btn.onclick = ()=>{ empresaSeleccionadaComp = emp; renderPanelComparativo(); };
    tabsWrap.appendChild(btn);
  });

  function ingresosPorAnio(anio){
    if(empresaSeleccionadaComp === "__TODAS__"){
      const out = new Array(12).fill(0);
      DATA.empresas.forEach(emp=>{
        const d = DATA.mensual[emp][String(anio)] || {};
        serieClase(d, DATA.claseIngresos).forEach((v,i)=> out[i]+=v);
      });
      return out;
    }
    const d = DATA.mensual[empresaSeleccionadaComp][String(anio)] || {};
    return serieClase(d, DATA.claseIngresos);
  }

  const serieActual = ingresosPorAnio(anioActual);
  const serieAnterior = ingresosPorAnio(anioAnterior);
  const totalActual = sum(serieActual), totalAnterior = sum(serieAnterior);

  const kpiWrap = document.getElementById("kpi-comp");
  kpiWrap.innerHTML = `
    <div class="kpi ingreso"><div class="label">Ingresos ${anioActual}</div><div class="value">${fmt(totalActual)}</div></div>
    <div class="kpi ingreso"><div class="label">Ingresos ${anioAnterior}</div><div class="value">${fmt(totalAnterior)}</div></div>
    <div class="kpi resultado"><div class="label">Variación</div><div class="value">${fmtPct((totalActual-totalAnterior)/totalAnterior)}</div></div>`;

  destroyChart("chartComparativo");
  const tipo = tipoGrafico("comparativo", "bar");
  charts["chartComparativo"] = new Chart(document.getElementById("chartComparativo"), {
    type: tipo,
    data: {
      labels: DATA.meses,
      datasets: [
        { label: String(anioAnterior), data: serieAnterior, backgroundColor: "#C9D6C9", borderColor:"#9CB39C", borderRadius: 3, tension:0.25 },
        { label: String(anioActual), data: serieActual, backgroundColor: ACCENT, borderColor: ACCENT, borderRadius: 3, tension:0.25 },
      ]
    },
    options: chartOptions("$")
  });
}

/* ============================== PANEL 5: Detalle por cuenta ============================== */
function renderPanelDetalle(){
  const selEmpresa = document.getElementById("filtroEmpresa");
  const selClase = document.getElementById("filtroClase");
  const selAnio = document.getElementById("filtroAnio");
  const buscar = document.getElementById("filtroBuscar");

  if(selEmpresa.options.length === 0){
    selEmpresa.innerHTML = `<option value="">Todas las empresas</option>` +
      DATA.empresas.map(e=>`<option value="${e}">${nombreEmpresa(e)}</option>`).join("");
    selClase.innerHTML = `<option value="">Todas las clases</option>` +
      Object.entries(DATA.claseLabels).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
    selAnio.innerHTML = DATA.anios.slice().sort((a,b)=>b-a).map(a=>`<option value="${a}">${a}</option>`).join("");
    selAnio.value = String(anioActual);
    [selEmpresa, selClase, selAnio].forEach(el=> el.onchange = renderTablaDetalle);
    buscar.oninput = renderTablaDetalle;
  }
  renderTablaDetalle();
}

function renderTablaDetalle(){
  const empresa = document.getElementById("filtroEmpresa").value;
  const clase = document.getElementById("filtroClase").value;
  const anio = document.getElementById("filtroAnio").value;
  const texto = document.getElementById("filtroBuscar").value.toLowerCase();

  let filas = DATA.cuentas.filter(r=>
    (!empresa || r.empresa === empresa) &&
    (!clase || r.clase === clase) &&
    (!anio || String(r.anio) === anio) &&
    (!texto || r.nombreCuentaMayor.toLowerCase().includes(texto) || r.cuentaMayor.includes(texto))
  );
  filas.sort((a,b)=> Math.abs(b.movimiento) - Math.abs(a.movimiento));

  const tbody = document.getElementById("tablaDetalle");
  tbody.innerHTML = filas.slice(0, 200).map(r=>`
    <tr>
      <td>${nombreEmpresa(r.empresa)}</td>
      <td>${r.cuentaMayor}</td>
      <td>${r.nombreCuentaMayor}</td>
      <td>${r.nombreClase}</td>
      <td>${fmt(r.movimiento)}</td>
    </tr>`).join("");

  if(filas.length === 0){
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--ink-soft);">Sin resultados para este filtro.</td></tr>`;
  }
}

/* ============================== Navegación de pestañas principales ============================== */
const PANELS = [
  { id: "general", label: "Panel General", render: renderPanelGeneral },
  { id: "ingresos", label: "Ingresos por empresa", render: renderPanelIngresos },
  { id: "utilidades", label: "Utilidades", render: renderPanelUtilidades },
  { id: "ivsg", label: "Ingresos vs. gastos", render: renderPanelIvsG },
  { id: "comparativo", label: "Comparativo años anteriores", render: renderPanelComparativo },
  { id: "detalle", label: "Detalle por cuenta", render: renderPanelDetalle },
];

const PANEL_HTML = {
  general: `
    <div class="filter-bar">
      <div class="filter-group"><label>Año</label><select id="gAnio"></select></div>
      <div class="filter-group"><label>Mes desde</label><select id="gMesDesde"></select></div>
      <div class="filter-group"><label>Mes hasta</label><select id="gMesHasta"></select></div>
    </div>
    <div class="kpis" id="kpi-general"></div>
    <section><h2>Ingresos por empresa en el periodo seleccionado</h2>
      <div class="chart-card"><canvas id="chartGeneral"></canvas></div>
    </section>`,
  ingresos: `
    <div class="kpis" id="kpi-ingresos"></div>
    <section><h2>Ingresos mensuales por empresa</h2>
      <div class="chart-card"><canvas id="chartIngresosEmpresas"></canvas></div>
    </section>`,
  utilidades: `
    <div class="kpis" id="kpi-utilidades"></div>
    <section><h2>Utilidad mensual por empresa</h2>
      <div class="chart-card"><canvas id="chartUtilidades"></canvas></div>
    </section>`,
  ivsg: `
    <div class="entity-tabs" id="entity-tabs-ivsg"></div>
    <div class="kpis" id="kpi-ivsg"></div>
    <section><h2>Ingresos vs. gastos por mes</h2>
      <div class="chart-card"><canvas id="chartIvsG"></canvas></div>
    </section>`,
  comparativo: `
    <div class="entity-tabs" id="entity-tabs-comp"></div>
    <div class="kpis" id="kpi-comp"></div>
    <section><h2>Ingresos por mes — comparación entre años</h2>
      <div class="chart-card"><canvas id="chartComparativo"></canvas></div>
    </section>`,
  detalle: `
    <section>
      <h2>Detalle por cuenta</h2>
      <div class="filters">
        <select id="filtroEmpresa"></select>
        <select id="filtroClase"></select>
        <select id="filtroAnio"></select>
        <input id="filtroBuscar" type="text" placeholder="Buscar cuenta...">
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Empresa</th><th>Cuenta</th><th>Nombre cuenta</th><th>Clase</th><th>Movimiento</th></tr></thead>
          <tbody id="tablaDetalle"></tbody>
        </table>
      </div>
    </section>`,
};

function initTabs(){
  const tabsWrap = document.getElementById("mainTabs");
  const panelsWrap = document.getElementById("panels");

  PANELS.forEach((p, i) => {
    const btn = document.createElement("button");
    btn.textContent = p.label;
    if (i === 0) btn.classList.add("active");
    btn.onclick = () => activarPanel(p.id);
    tabsWrap.appendChild(btn);

    const div = document.createElement("div");
    div.className = "panel" + (i === 0 ? " active" : "");
    div.id = "panel-" + p.id;
    div.innerHTML = PANEL_HTML[p.id];
    panelsWrap.appendChild(div);
  });

  PANELS[0].render();
}

function activarPanel(id){
  document.querySelectorAll(".tabs button").forEach((b,i)=> b.classList.toggle("active", PANELS[i].id === id));
  document.querySelectorAll(".panel").forEach(p=> p.classList.toggle("active", p.id === "panel-"+id));
  const panel = PANELS.find(p=>p.id===id);
  if(panel) panel.render();
}

initTabs();
</script>
</body>
</html>
